function saveReport(){if(!validateCurrent())return;clearTimeout(saveTimer);saveTimer=null;let data;try{data=normalizeReport({...current,updatedAt:now()});data.tasks=data.tasks.filter(t=>t.task.trim());}catch(e){toast(e.message,true);return}const idx=reports.findIndex(r=>r.id===data.id);if(idx<0&&reports.length>=MAX_REPORTS){toast('최대 2,000건입니다. 먼저 백업하고 오래된 보고서를 정리하세요.',true);return}const next=reports.slice();if(idx>=0)next[idx]=data;else next.push(data);if(persistReports(next)){current=JSON.parse(JSON.stringify(data));autosave();render();toast('작성완료 · 이 브라우저에 저장했습니다. 회사에 제출되지 않았습니다.')}}
function hasContent(){return !!(current.author.trim()||current.project.trim()||current.role.trim()||current.reviewer.trim()||current.tasks.some(t=>t.task.trim()||t.result.trim()||t.hours||t.progress||t.status!=='예정')||current.nextPlans.trim()||current.issues.trim()||current.requests.trim()||current.notes.trim())}
function newReport(){if(hasContent()&&!confirm('현재 작성 중인 내용은 새 임시보고서로 바뀝니다. 저장되지 않은 수정 내용은 사라집니다. 새로 시작할까요?'))return;clearTimeout(saveTimer);current=blank();lastAutosave='';autosave();changeView('write')}
function editReport(id){const r=reports.find(r=>r.id===id);if(!r)return;if(r.id!==current.id&&hasContent()&&!confirm('현재 임시보고서를 선택한 보고서로 바꿀까요? 저장되지 않은 수정 내용은 사라집니다.'))return;clearTimeout(saveTimer);current=JSON.parse(JSON.stringify(r));autosave();changeView('write')}
function deleteReport(id){const r=reports.find(r=>r.id===id);if(!r||!confirm(dateText(r.date)+' · '+r.author+' 보고서를 삭제할까요? 저장된 보고서는 복구할 수 없습니다.'))return;if(persistReports(reports.filter(x=>x.id!==id))){if(current.id===id){current=blank();autosave()}render();toast('저장된 보고서를 삭제했습니다.')}}
function reportRow(r,full){const s=stats([r]);return '<tr><td>'+esc(dateText(r.date))+'</td><td><button class="report-link" data-action="edit-report" data-id="'+esc(r.id)+'" title="'+esc(r.author+' / '+(r.project||'프로젝트 미지정'))+'">'+esc(r.author)+' <span style="font-weight:400;color:#a0adb5">/ '+esc(r.project||r.department)+'</span></button>'+(r.isDemo?' <span class="badge demo">샘플</span>':'')+'</td><td>'+s.tasks+'건'+(full?' · '+num(s.hours)+'h':'')+'</td><td><span class="badge">작성완료 · 로컬</span></td><td><div class="actions">'+(full?'<button class="icon-button" data-action="preview-saved" data-id="'+esc(r.id)+'" aria-label="'+esc(r.author)+' 보고서 인쇄">'+icon('print',16)+'</button><button class="icon-button" data-action="edit-report" data-id="'+esc(r.id)+'" aria-label="'+esc(r.author)+' 보고서 수정">'+icon('edit',16)+'</button><button class="icon-button" data-action="delete" data-id="'+esc(r.id)+'" aria-label="'+esc(r.author)+' 보고서 삭제">'+icon('trash',16)+'</button>':'<button class="icon-button" data-action="edit-report" data-id="'+esc(r.id)+'" aria-label="보고서 열기">'+icon('arrow',15)+'</button>')+'</div></td></tr>'}
function filtered(){return reports.filter(r=>(!filters.q||[r.author,r.department,r.role,r.project,r.reviewer,...r.tasks.map(t=>t.task+' '+t.result),r.nextPlans,r.issues,r.requests,r.notes].join(' ').toLowerCase().includes(filters.q.toLowerCase()))&&(!filters.from||r.date>=filters.from)&&(!filters.to||r.date<=filters.to)&&(filters.kind==='all'||(filters.kind==='demo'?r.isDemo:!r.isDemo))).sort((a,b)=>b.date.localeCompare(a.date)||b.updatedAt.localeCompare(a.updatedAt))}
function archive(){return head('REPORT ARCHIVE','보고서 보관함','기록한 하루를 찾아보고, 필요한 내용을 다시 확인하세요.',button('csv','CSV 내보내기','download','')+button('new','새 보고서 작성'))+'<section class="card"><div class="filters"><div class="field search"><label for="filter-q">통합 검색</label><input id="filter-q" data-filter="q" type="search" value="'+esc(filters.q)+'" placeholder="작성자, 부서, 프로젝트, 업무 내용 검색"></div><div class="field"><label for="filter-from">시작 일자</label><input id="filter-from" data-filter="from" type="date" value="'+esc(filters.from)+'"></div><div class="field"><label for="filter-to">종료 일자</label><input id="filter-to" data-filter="to" type="date" value="'+esc(filters.to)+'"></div><div class="field"><label for="filter-kind">기록 구분</label><select id="filter-kind" data-filter="kind"><option value="all" '+(filters.kind==='all'?'selected':'')+'>전체</option><option value="real" '+(filters.kind==='real'?'selected':'')+'>일반 보고서</option><option value="demo" '+(filters.kind==='demo'?'selected':'')+'>샘플 보고서</option></select></div><button class="btn" data-action="reset-filters">초기화</button></div><div class="archive-count" id="archiveCount"></div><div id="archiveRows"></div></section><div class="note-card" style="margin-top:19px"><p>모든 보고서는 <strong>개인 기기의 작성완료 기록</strong>입니다. 실제 제출·승인 여부를 나타내지 않습니다. CSV에는 현재 검색 및 날짜 조건에 맞는 보고서만 포함됩니다. 전체 복원용 백업은 이용 안내에서 JSON으로 내보내세요.</p></div>'}
function renderArchiveRows(){const list=filtered();$('#archiveCount').textContent=(filters.from&&filters.to&&filters.from>filters.to?'시작 일자가 종료 일자보다 늦습니다. ':'')+'총 '+reports.length+'건 중 '+list.length+'건 · 업무명 기준 검색 포함';$('#archiveRows').innerHTML=list.length?'<div class="table-wrap"><table><thead><tr><th>보고 일자</th><th>작성자 / 프로젝트</th><th>업무 / 시간</th><th>저장 상태</th><th>관리</th></tr></thead><tbody>'+list.map(r=>reportRow(r,true)).join('')+'</tbody></table></div>':'<div class="empty"><div class="empty-ill">'+icon('search',30)+'</div><h3>'+(reports.length?'조건에 맞는 기록이 없어요':'저장된 보고서가 없어요')+'</h3><p>'+(reports.length?'검색어나 날짜 조건을 변경해 보세요.':'새 보고서를 작성하고 저장하면 이곳에서 확인할 수 있습니다.')+'</p>'+button(reports.length?'reset-filters':'new',reports.length?'검색 조건 초기화':'새 보고서 작성','plus','')+'</div>'}
function help(){return head('WORKSPACE GUIDE','이용 안내','기록을 안전하게 관리하기 위한 사용 방법을 확인하세요.')+'<div class="warning"><strong>일반 일일보고 양식 · 사내 공식 양식 확인 전</strong><p>에이스엔지니어링 해외사업팀 전용 일일보고 작성 도구입니다. 로고는 제공받은 에이스엔지니어링 이미지입니다. 작성자는 지정된 7명 중 선택하며 직급은 자동 반영됩니다. 현재 링크는 공개되어 있으며 이름 선택은 사용자 인증이나 접근 제한 기능이 아닙니다. 사내 보안·보고 절차를 확인해 주세요.</p></div><div class="help-grid"><section class="card help-card"><h2>'+icon('edit',19)+' 작성과 저장</h2><ol><li>보고 일자와 업무명을 입력하고 작성자는 해외사업팀 7명 중 선택합니다. 소속 부서는 해외사업팀으로 고정되며 직급은 자동으로 반영됩니다.</li><li>업무 분류·결과·상태·진행률과 시간을 기록합니다. 시간은 업무별 0~24시간, 진행률은 0~100%입니다.</li><li>입력 내용은 약 0.6초 후 임시저장되며 새로고침 후 복구됩니다. 임시보고서는 한 개만 유지됩니다.</li><li><strong>보고서 저장</strong>으로 작성완료 기록을 만듭니다. 저장은 실제 회사 제출이나 승인이 아닙니다.</li><li>보관함에서 수정·삭제·검색·인쇄할 수 있습니다. 수정 시 기존 ID와 생성일을 유지합니다.</li></ol></section><section class="card help-card"><h2>'+icon('shield',19)+' 저장 위치와 개인정보</h2><p>모든 기록은 현재 브라우저의 <code>localStorage</code>에 저장됩니다. 서버 전송, GitHub 로그인 연동, 실제 결재, 팀 공유 및 다중 기기 동기화는 없습니다.</p><ul><li>같은 사이트 주소·같은 브라우저에서만 기록을 볼 수 있습니다.</li><li>브라우저 데이터 삭제, 시크릿 모드 종료, 저장 용량 초과 또는 기기 변경으로 데이터가 사라질 수 있습니다.</li><li>공용 기기에서는 개인정보·기밀 정보를 입력하지 마세요. 이 저장소는 별도로 암호화되지 않습니다.</li><li>저장소 오류가 감지되면 원본을 자동 삭제하거나 덮어쓰지 않습니다. 상단의 원본 내보내기를 이용하세요.</li></ul></section><section class="card help-card"><h2>'+icon('download',19)+' 백업과 가져오기</h2><p>JSON은 <strong>저장된 전체 보고서와 현재 임시보고서</strong>를 담는 복원용 백업입니다. 정기적으로 안전한 위치에 보관하세요. CSV는 보관함의 검색 결과를 업무별 한 행으로 내보냅니다.</p><p>가져오기는 이 도구의 버전 1 JSON만 지원합니다. 최대 5MB, 보고서 2,000건, 보고서별 업무 100개입니다. 동일 ID의 보고서는 건너뛰며, 기존 기록을 덮어쓰지 않습니다. 백업의 임시보고서는 자동 교체하지 않습니다.</p><div class="actions">'+button('backup','JSON 백업','download','')+button('import','JSON 가져오기','upload','')+'</div><p>CSV의 수식으로 해석될 수 있는 값은 작은따옴표를 붙여 보호합니다. JSON 백업에는 원문이 유지됩니다.</p></section><section class="card help-card"><h2>'+icon('print',19)+' 인쇄와 텍스트 복사</h2><p>작성 중이거나 저장된 보고서를 미리보기로 확인한 후 A4로 인쇄할 수 있습니다. 필수 입력을 완료해야 빈 양식 대신 보고서가 출력됩니다. 인쇄 화면의 대상을 <strong>PDF로 저장</strong>으로 선택하면 파일을 만들 수 있습니다.</p><p>텍스트 복사는 현재 보고서 전체를 일반 텍스트로 복사합니다. 브라우저 클립보드 권한이 없으면 수동 선택·복사 창을 제공합니다. 실제 전달·제출은 회사가 지정한 절차로 별도 진행해 주세요.</p><div class="actions">'+button('demo','샘플 체험','file','')+'</div><p>샘플은 작성 화면에만 불러오며 자동 저장된 완료 보고서나 실제 제출로 처리되지 않습니다. 직접 저장하면 샘플로 구분됩니다.</p></section><section class="card help-card help-wide"><h2>'+icon('archive',19)+' GitHub Pages 정적 배포</h2><ol><li>이 <code>index.html</code> 파일에는 작성자 7명의 이름·직급과 제공받은 로고가 포함되어 공개됩니다. 프로그램 파일만 GitHub 저장소에 업로드합니다. 백업 JSON·CSV는 공개 저장소에 올리지 마세요.</li><li>저장소의 <strong>Settings → Pages → Build and deployment</strong>에서 <strong>Deploy from a branch</strong>를 선택합니다.</li><li>파일이 있는 브랜치와 폴더(예: <code>main / root</code>)를 선택하고 저장한 뒤 GitHub가 표시한 배포 주소로 접속합니다.</li><li>이 사이트는 정적 파일 한 개로 동작하며 OAuth·서버·데이터베이스 설정은 없습니다. HTTPS 환경에서 클립보드 기능이 더 안정적으로 동작합니다.</li></ol><p>로컬 파일 주소와 배포 주소는 저장소가 서로 다릅니다. 기기나 주소를 바꾸기 전 JSON을 백업하고 새 환경에서 가져오세요. GitHub Pages에 배포해도 보고서가 GitHub에 저장되거나 팀에 공유되지는 않습니다.</p></section></div>'}

function openPreview(r){if(errors(r).length){toast('인쇄 전 필수 항목과 업무 입력 범위를 확인하세요.',true);return}previewReport=JSON.parse(JSON.stringify(r));const html=printable(previewReport);$('#previewContent').innerHTML=html;$('#printRoot').innerHTML=html;$('#preview').showModal()}
function textReport(r){return [(r.isDemo?'[샘플 보고서]\n':'')+'에이스엔지니어링 해외사업팀 | 일일보고','보고 일자: '+r.date,'작성자: '+r.author+' / '+r.department,'직위·직책: '+(r.role||'미입력'),'프로젝트·현장: '+(r.project||'미입력'),'검토자(기록용): '+(r.reviewer||'미입력'),'','[오늘의 업무]',...activeTasks(r).map((t,i)=>(i+1)+'. ['+t.category+'] '+t.task+'\n   결과: '+(t.result||'미입력')+'\n   상태: '+t.status+' | 진행률: '+t.progress+'% | 시간: '+t.hours+'h'),...['nextPlans','issues','requests','notes'].map((k,i)=>'\n['+['내일의 업무 계획','이슈 / 리스크','협조 / 요청 사항','기타 메모'][i]+']\n'+(r[k]||'기재 사항 없음')),'','일반 일일보고 양식 · 사내 공식 양식 확인 전','개인 로컬 기록입니다. 실제 회사 제출·승인 내역이 아닙니다.'].join('\n')}
async function copyReport(){if(!validateCurrent())return;const txt=textReport(current);try{if(!navigator.clipboard?.writeText)throw Error('unavailable');await navigator.clipboard.writeText(txt);toast('보고서 텍스트를 복사했습니다.')}catch(e){const dlg=document.createElement('dialog');dlg.setAttribute('aria-label','보고서 텍스트 수동 복사');dlg.innerHTML='<div class="preview-toolbar"><strong>텍스트 복사</strong><button class="btn small" type="button">닫기</button></div><div style="padding:22px"><p style="font-size:12px">클립보드를 사용할 수 없습니다. 아래 내용을 선택해 Ctrl / ⌘ + C로 복사하세요.</p><textarea aria-label="복사할 보고서 내용" readonly style="height:55vh"></textarea></div>';document.body.append(dlg);dlg.querySelector('textarea').value=txt;dlg.querySelector('button').onclick=()=>dlg.close();dlg.addEventListener('close',()=>dlg.remove());dlg.showModal();dlg.querySelector('textarea').focus();dlg.querySelector('textarea').select()}}
function download(text,name,type){try{const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('파일 다운로드를 시작했습니다.')}catch(e){toast('파일을 내보내지 못했습니다.',true)}}
function backup(){if(saveTimer)autosave();let draft=null;try{draft=normalizeReport(current,false)}catch(e){toast('입력값이 올바르지 않아 임시보고서는 백업에서 제외합니다.',true)}download(JSON.stringify({version:1,exportedAt:now(),reports,draft},null,2),'ace-daily-backup-'+today()+'.json','application/json;charset=utf-8')}
function csv(){const list=view==='archive'?filtered():reports;if(!list.length){toast('내보낼 보고서가 없습니다.',true);return}const rows=[['보고서 ID','구분','보고 일자','작성자','부서','직위/직책','프로젝트/현장','검토자(기록용)','업무 분류','업무 내용','수행 결과','상태','진행률(%)','시간(h)','내일 계획','이슈/리스크','협조/요청','메모','저장 상태']];list.forEach(r=>activeTasks(r).forEach(t=>rows.push([r.id,r.isDemo?'샘플':'일반',r.date,r.author,r.department,r.role,r.project,r.reviewer,t.category,t.task,t.result,t.status,t.progress,t.hours,r.nextPlans,r.issues,r.requests,r.notes,'작성완료 · 로컬 미제출'])));const cell=v=>{let x=String(v??'');if(/^[\s\u0000-\u001f]*[=+@-]/.test(x)||/^[\t\r\n]/.test(x))x="'"+x;return '"'+x.replace(/"/g,'""')+'"'};download('\uFEFF'+rows.map(row=>row.map(cell).join(',')).join('\r\n'),'ace-daily-reports-'+today()+'.csv','text/csv;charset=utf-8')}
async function importJSON(file){if(!file)return;if(reportsBlocked){toast('저장소 문제가 해결되기 전에는 가져올 수 없습니다.',true);return}if(file.size>MAX_FILE){toast('5MB 이하 JSON 파일만 가져올 수 있습니다.',true);return}try{const obj=JSON.parse(await file.text());if(!isObj(obj)||obj.version!==1||!Array.isArray(obj.reports)||obj.reports.length>MAX_REPORTS)throw Error('버전 1의 보고서 백업 JSON이 아닙니다.');if(obj.exportedAt!==undefined&&(typeof obj.exportedAt!=='string'||!Number.isFinite(Date.parse(obj.exportedAt))))throw Error('백업 생성일 형식이 올바르지 않습니다.');const imported=obj.reports.map(r=>{const normalized=normalizeReport(r);const member=TEAM.find(m=>m.name===normalized.author);if(!member||normalized.department!=='해외사업팀')throw Error('해외사업팀 지정 작성자의 보고서만 가져올 수 있습니다.');normalized.role=member.role;return normalized;});if(obj.draft!==undefined&&obj.draft!==null)normalizeReport(obj.draft,false);const seen=new Set(reports.map(r=>r.id)),added=[];let duplicate=0;for(const r of imported){if(seen.has(r.id)){duplicate++;continue}seen.add(r.id);added.push(r)}if(reports.length+added.length>MAX_REPORTS)throw Error('병합 후 보고서는 최대 2,000건 이하여야 합니다.');if(!added.length){toast('추가할 새 보고서가 없습니다. 동일 ID '+duplicate+'건은 유지했습니다. 백업 임시보고서는 자동으로 가져오지 않습니다.');return}if(!confirm('새 보고서 '+added.length+'건을 가져올까요?\n중복 ID '+duplicate+'건은 건너뛰며 기존 기록과 현재 임시보고서는 유지합니다.\n가져온 데이터는 이 브라우저에만 저장됩니다.'))return;if(persistReports([...reports,...added])){render();toast(added.length+'건을 가져왔습니다. 중복 '+duplicate+'건은 건너뛰었습니다.')}}catch(e){toast('가져오기 취소: '+(e instanceof SyntaxError?'손상되었거나 JSON이 아닌 파일입니다.':e.message),true)}finally{$('#importFile').value=''}}
function demo(){if(hasContent()&&!confirm('샘플을 불러오면 현재 임시보고서가 바뀝니다. 저장하지 않은 수정 내용은 사라집니다. 계속할까요?'))return;clearTimeout(saveTimer);current={...blank(),author:'남종현',department:'해외사업팀',role:'과장',project:'샘플 프로젝트 A',isDemo:true,tasks:[{category:'설계',task:'[샘플] 도면 검토 및 수정 사항 정리',result:'검토 의견 3건 정리, 수정 체크리스트 작성',status:'완료',progress:100,hours:3},{category:'품질',task:'[샘플] 자재 사양 확인',result:'제조사 자료 검토 중, 추가 자료 확인 필요',status:'진행',progress:50,hours:2}],nextPlans:'[샘플] 검토 의견 반영 후 수정 도면 확인\n자재 사양 관련 추가 자료 요청',issues:'[샘플] 자료 회신 지연 가능성 점검',requests:'[샘플] 관련 자료 확인 요청',notes:'이 보고서는 기능 체험용 예시입니다. 실제 업무 또는 회사 제출 기록이 아닙니다.'};autosave();changeView('write');toast('샘플을 작성 화면에 불러왔습니다. 완료 보고서로 저장하거나 제출하지 않았습니다.')}
document.addEventListener('input',e=>{const el=e.target;if(el.matches('[data-field]')){current[el.dataset.field]=el.value;if(el.dataset.field==='author'){current.role=TEAM.find(m=>m.name===el.value)?.role||'';current.department='해외사업팀';$('#f-role').value=current.role;$('#f-department').value=current.department;}updateSummary();scheduleSave()}else if(el.matches('[data-task][data-key]')){const key=el.dataset.key,t=current.tasks[Number(el.dataset.task)];if(!t)return;t[key]=['hours','progress'].includes(key)?(el.value===''?0:Number(el.value)):el.value;updateSummary();scheduleSave()}else if(el.matches('[data-filter]')){filters[el.dataset.filter]=el.value;renderArchiveRows()}});
document.addEventListener('change',e=>{if(e.target.matches('select[data-field=author]')){current.author=e.target.value;current.role=TEAM.find(m=>m.name===current.author)?.role||'';current.department='해외사업팀';$('#f-role').value=current.role;$('#f-department').value=current.department;updateSummary();scheduleSave();}if(e.target.id==='importFile')importJSON(e.target.files[0]);if(e.target.matches('select[data-task]')){const t=current.tasks[Number(e.target.dataset.task)];if(t){t[e.target.dataset.key]=e.target.value;updateSummary();scheduleSave()}}if(e.target.matches('select[data-filter]')){filters[e.target.dataset.filter]=e.target.value;renderArchiveRows()}});
document.addEventListener('submit',e=>{if(e.target.id==='reportForm'){e.preventDefault();saveReport()}});
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el||el.disabled)return;if(el.dataset.nav){changeView(el.dataset.nav);return}const action=el.dataset.action;if(!action)return;switch(action){case'new':newReport();break;case'save':saveReport();break;case'demo':demo();break;case'add-task':if(current.tasks.length<100){current.tasks.push(emptyTask());autosave();render();const id='#t-'+(current.tasks.length-1)+'-task';$(id)?.focus()}break;case'remove-task':if(current.tasks.length>1){const idx=Number(el.dataset.index),t=current.tasks[idx];if((t.task||t.result||t.hours||t.progress)&&!confirm('이 업무 항목을 삭제할까요?'))return;current.tasks.splice(idx,1);autosave();render()}break;case'edit-report':editReport(el.dataset.id);break;case'delete':deleteReport(el.dataset.id);break;case'preview-current':if(validateCurrent())openPreview(current);break;case'preview-saved':{const r=reports.find(x=>x.id===el.dataset.id);if(r)openPreview(r);break}case'close-preview':$('#preview').close();break;case'print-confirm':if(previewReport){$('#printRoot').innerHTML=printable(previewReport);window.print()}break;case'copy':copyReport();break;case'csv':csv();break;case'backup':backup();break;case'import':$('#importFile').value='';$('#importFile').click();break;case'reset-filters':filters={q:'',from:'',to:'',kind:'all'};render();break;case'recovery':download(JSON.stringify({recoveredAt:now(),note:'원본 저장소 데이터. 자동 가져오기 형식이 아닙니다. 원본을 안전하게 보관하세요.',items:broken},null,2),'ace-storage-recovery-'+today()+'.json','application/json;charset=utf-8');break}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'&&view==='write'&&!document.querySelector('dialog[open]')){e.preventDefault();saveReport()}});
window.addEventListener('beforeunload',()=>{if(saveTimer)autosave()});
window.addEventListener('storage',e=>{if(e.key===KEY||e.key===null){reportsBlocked=true;broken.push({key:KEY,raw:e.newValue});warning();toast('다른 탭에서 저장소가 바뀌었습니다. 충돌을 막기 위해 저장을 중지합니다. 현재 내용을 복사한 후 새로고침하세요.',true)}if(e.key===DRAFT||e.key===null){draftBlocked=true;broken.push({key:DRAFT,raw:e.newValue});warning();lastAutosave='다른 탭 변경 감지 · 임시저장 중지';updateAutosave()}});
$('#today').textContent=new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
load();render();if(draftPresent)setTimeout(()=>toast('이전 임시보고서를 복구했습니다. 보고서 작성에서 이어 쓸 수 있습니다.'),500);
})();
</script>
</body>
