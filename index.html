<main class="main"><header class="topbar"><div class="topbar-title">DAILY WORK REPORT <b>/</b><span class="desktop-text" id="breadcrumb">업무 대시보드</span></div><div class="top-right"><time id="today"></time><span>로컬 모드</span><div class="profile" aria-label="개인 로컬 작업 공간">MY</div></div></header><div class="content"><div id="storageWarning" role="alert"></div><div id="view"></div><footer class="footer"><span>ACE ENGINEERING · 개인용 일일 업무 기록 도구</span><span>ONE DAY, ONE STEP FORWARD.</span></footer></div></main>

<script>
'use strict';
(() => {
const KEY='ace.daily.reports.v1', DRAFT='ace.daily.draft.v1', MAX_FILE=5*1024*1024, MAX_REPORTS=2000;
const icons={grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',edit:'<path d="M14 4l6 6M3 21l4-1 13-13a3 3 0 0 0-4-4L3 16v5Z"/><path d="M12 21h9"/>',archive:'<path d="M4 7v14h16V7M3 3h18v4H3zM9 11h6"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 0 1 6 0c0 2-3 2-3 5M12 17h.01"/>',plus:'<path d="M12 5v14M5 12h14"/>',arrow:'<path d="M5 12h14M14 7l5 5-5 5"/>',file:'<path d="M14 3H5v18h14V8zM14 3v5h5M8 12h8M8 16h6"/>',check:'<path d="M5 12l4 4L19 6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',chart:'<path d="M4 20V4M4 20h17M8 16v-4M13 16V8M18 16V5"/>',trash:'<path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/>',download:'<path d="M12 3v12M7 10l5 5 5-5M4 16v5h16v-5"/>',upload:'<path d="M12 16V4M7 9l5-5 5 5M4 17v4h16v-4"/>',print:'<path d="M6 9V3h12v6M6 17H3V9h18v8h-3M6 14h12v7H6zM17 12h.01"/>',copy:'<rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V3H4v13h4"/>',shield:'<path d="M12 3l8 3v6c0 5-8 9-8 9s-8-4-8-9V6zM8 12l3 3 5-6"/>',search:'<circle cx="10" cy="10" r="6"/><path d="M15 15l6 6"/>'};
const icon=(name,size=18)=>'<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(icons[name]||icons.file)+'</svg>';
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const uuid=()=>globalThis.crypto?.randomUUID?.()||'ace-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,12);
const now=()=>new Date().toISOString(), num=n=>new Intl.NumberFormat('ko-KR',{maximumFractionDigits:2}).format(n), dateText=d=>d?d.replace(/-/g,'. '):'날짜 미지정';
const CATEGORIES=['설계','현장','시공','품질','안전','관리','기타'], STATUSES=['예정','진행','완료','보류'];
const emptyTask=()=>({category:'설계',task:'',result:'',status:'예정',progress:0,hours:0});
const blank=()=>({id:uuid(),date:today(),author:'',department:'',role:'',project:'',reviewer:'',tasks:[emptyTask()],nextPlans:'',issues:'',requests:'',notes:'',isDemo:false,createdAt:now(),updatedAt:now()});
let reports=[], current=blank(), view='dashboard', draftPresent=false, saveTimer=null, lastAutosave='', reportsBlocked=false,draftBlocked=false,broken=[],previewReport=null, filters={q:'',from:'',to:'',kind:'all'};
const validDate=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&Number(s.slice(0,4))>=1900&&Number(s.slice(0,4))<=2199&&!isNaN(Date.parse(s))&&new Date(s+'T00:00:00Z').toISOString().slice(0,10)===s;
const isObj=v=>v!==null&&typeof v==='object'&&!Array.isArray(v);
const bounded=(v,n)=>typeof v==='string'&&v.length<=n;
function normalizeReport(v,saved=true){
 if(!isObj(v)||!bounded(v.id,100)||!/^[a-zA-Z0-9_-]{8,100}$/.test(v.id)||!validDate(v.date)||typeof v.isDemo!=='boolean'||!bounded(v.createdAt,40)||!bounded(v.updatedAt,40)||!/^\d{4}-\d\d-\d\dT/.test(v.createdAt)||!/^\d{4}-\d\d-\d\dT/.test(v.updatedAt)||!Number.isFinite(Date.parse(v.createdAt))||!Number.isFinite(Date.parse(v.updatedAt)))throw Error('보고서 ID, 날짜 또는 생성 정보가 올바르지 않습니다.');
 const limits={author:100,department:100,role:100,project:200,reviewer:100,nextPlans:10000,issues:10000,requests:10000,notes:10000};
 const out={id:v.id,date:v.date,isDemo:v.isDemo,createdAt:v.createdAt,updatedAt:v.updatedAt};
 for(const [k,n]of Object.entries(limits)){if(!bounded(v[k],n))throw Error('보고서의 '+k+' 항목 형식 또는 길이가 올바르지 않습니다.');out[k]=v[k];}
 if(!Array.isArray(v.tasks)||v.tasks.length<1||v.tasks.length>100)throw Error('업무 항목은 1개 이상 100개 이하여야 합니다.');
 out.tasks=v.tasks.map(t=>{if(!isObj(t)||!CATEGORIES.includes(t.category)||!STATUSES.includes(t.status)||!bounded(t.task,1000)||!bounded(t.result,5000)||typeof t.progress!=='number'||!Number.isFinite(t.progress)||t.progress<0||t.progress>100||typeof t.hours!=='number'||!Number.isFinite(t.hours)||t.hours<0||t.hours>24)throw Error('업무의 분류, 상태, 진행률 또는 시간 범위를 확인하세요.');return {category:t.category,task:t.task,result:t.result,status:t.status,progress:t.progress,hours:t.hours};});
 if(saved&&(!out.author.trim()||!out.department.trim()||!out.tasks.some(t=>t.task.trim())))throw Error('필수 항목이 없는 보고서입니다.');
 return out;
}
function load(){
 try{const raw=localStorage.getItem(KEY);if(raw){try{const obj=JSON.parse(raw);if(!isObj(obj)||obj.version!==1||!Array.isArray(obj.reports)||obj.reports.length>MAX_REPORTS)throw Error('지원하지 않는 형식');const seen=new Set();reports=obj.reports.map(r=>{const t=normalizeReport(r);if(seen.has(t.id))throw Error('중복 ID');seen.add(t.id);return t;});}catch(e){reportsBlocked=true;broken.push({key:KEY,raw});}}}catch(e){reportsBlocked=true;broken.push({key:KEY,raw:null});}
 try{const raw=localStorage.getItem(DRAFT);if(raw){try{const d=JSON.parse(raw);if(!isObj(d)||d.version!==1)throw Error('형식 오류');current=normalizeReport(d.report,false);draftPresent=true;lastAutosave='이전 임시저장 복구됨';}catch(e){draftBlocked=true;broken.push({key:DRAFT,raw});}}}catch(e){draftBlocked=true;broken.push({key:DRAFT,raw:null});}
 warning();
}
function warning(){const el=$('#storageWarning');if(!broken.length){el.innerHTML='';return}el.innerHTML='<div class="warning"><strong>브라우저 저장소 확인이 필요합니다.</strong><p>저장 데이터가 손상되었거나 저장소 접근이 차단되어 있습니다. 원본을 덮어쓰지 않도록 '+(reportsBlocked?'보고서 저장 및 가져오기를':'임시저장을')+' 중지했습니다. '+(draftBlocked&&reportsBlocked?'임시저장도 사용할 수 없습니다. ':'')+'다른 브라우저로 원본을 복구하거나 파일을 백업해 주세요. 현재 입력 내용은 복사·인쇄할 수 있습니다.</p><button class="btn small" data-action="recovery">원본 데이터 내보내기</button></div>';}
function persistReports(next){if(reportsBlocked){toast('저장소 문제로 보고서 저장이 중지되었습니다.',true);return false}try{const payload=JSON.stringify({version:1,reports:next});if(new Blob([payload]).size>MAX_FILE)throw Error('limit');localStorage.setItem(KEY,payload);reports=next;return true}catch(e){toast('저장하지 못했습니다. 브라우저 용량·저장 권한을 확인하고 JSON으로 백업하세요.',true);return false}}
function autosave(){clearTimeout(saveTimer);saveTimer=null;current.updatedAt=now();draftPresent=true;if(draftBlocked){lastAutosave='임시저장 불가 · 복사/백업 권장';updateAutosave();return}try{normalizeReport(current,false);localStorage.setItem(DRAFT,JSON.stringify({version:1,report:current}));lastAutosave='기기에 임시저장됨 · '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});}catch(e){lastAutosave='임시저장 실패 · 입력 범위를 확인하세요';}updateAutosave();}
function scheduleSave(){clearTimeout(saveTimer);lastAutosave='임시저장 중…';updateAutosave();saveTimer=setTimeout(autosave,550)}
function updateAutosave(){const el=$('#autosave');if(el)el.textContent=lastAutosave||'입력하면 자동으로 임시저장됩니다'}
function toast(text,error=false){const el=document.createElement('div');el.className='toast'+(error?' error':'');el.textContent=text;$('#toasts').append(el);setTimeout(()=>el.remove(),5500)}
const activeTasks=r=>r.tasks.filter(t=>t.task.trim());
function stats(list){const tasks=list.flatMap(activeTasks);return {reports:list.length,tasks:tasks.length,hours:tasks.reduce((a,t)=>a+t.hours,0),done:tasks.filter(t=>t.status==='완료').length,progress:tasks.length?Math.round(tasks.reduce((a,t)=>a+t.progress,0)/tasks.length):0};}
function changeView(next){if(view==='write'&&saveTimer)autosave();view=next;render();window.scrollTo({top:0,behavior:'instant'})}
function render(){
 const navs=[['dashboard','grid','대시보드'],['write','edit','보고서 작성'],['archive','archive','보고서 보관함'],['help','help','이용 안내']];
 $('#nav').innerHTML=navs.map(([v,i,l])=>'<button class="nav-item '+(view===v?'active':'')+'" data-nav="'+v+'" '+(view===v?'aria-current="page"':'')+'>'+icon(i)+'<span>'+l+'</span></button>').join('');
 $('#breadcrumb').textContent=navs.find(n=>n[0]===view)[2];
 $('#view').innerHTML=view==='dashboard'?dashboard():view==='write'?editor():view==='archive'?archive():help();
 if(view==='write'){updateSummary();updateAutosave()}if(view==='archive')renderArchiveRows();
}
const head=(eyebrow,title,desc,actions='')=>'<div class="page-head"><div><div class="eyebrow">'+eyebrow+'</div><h1>'+title+'</h1><p>'+desc+'</p></div><div class="actions">'+actions+'</div></div>';
const button=(action,text,i='plus',cls='primary')=>'<button type="button" class="btn '+cls+'" data-action="'+action+'">'+icon(i,16)+text+'</button>';
function dashboard(){const s=stats(reports),recent=[...reports].sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt)).slice(0,5),todayCount=reports.filter(r=>r.date===today()).length;
 return head('YOUR DAILY WORKSPACE','오늘의 업무, 차곡차곡.','하루의 업무를 기록하고, 다음 걸음을 준비하세요.',button('new','새 보고서 작성'))+
 '<section class="hero"><div><div class="tiny">A BETTER WAY TO RECORD YOUR DAY</div><h2>작은 기록이 만드는 큰 변화</h2><p>진행한 업무부터 내일의 계획까지 한곳에서.<br>나의 업무 흐름을 선명하게 정리해 보세요.</p></div><svg class="hero-art" width="191" height="128" viewBox="0 0 191 128" fill="none" aria-hidden="true"><circle cx="120" cy="66" r="57" fill="#dcece6"/><path d="M39 111h127" stroke="#b3d0c4" stroke-width="2"/><rect x="61" y="12" width="84" height="102" rx="6" fill="#f9fcfa" stroke="#b5cec3"/><rect x="82" y="7" width="42" height="13" rx="4" fill="#9fbfb0"/><path d="M79 39h12M79 57h12M79 75h12M100 39h27M100 57h27M100 75h20" stroke="#afc7bc" stroke-width="3" stroke-linecap="round"/><rect x="116" y="74" width="45" height="45" rx="13" fill="#438d78"/><path d="M128 96l7 7 15-16" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M42 48l-8 7 8 7M165 35l8 7-8 7" stroke="#adcdbf" stroke-width="2"/></svg></section>'+
 '<section class="metrics" aria-label="저장된 보고서 통계">'+metric('저장된 보고서',s.reports,'건','file','이 브라우저에 저장된 전체 기록')+metric('오늘 작성한 보고서',todayCount,'건','edit',dateText(today())+' 기준')+metric('완료한 업무',s.done,'건','check','전체 '+num(s.tasks)+'개 업무 중 완료 상태')+metric('누적 업무 시간',s.hours,'h','clock','저장된 업무의 투입 시간 합계')+'</section>'+
 '<div class="dashboard-grid"><section class="card"><div class="card-head"><h2>최근 업무보고 <span class="sub">RECENT REPORTS</span></h2><button class="link-button" data-nav="archive">전체 보기 '+icon('arrow',14)+'</button></div>'+(recent.length?'<div class="table-wrap"><table><thead><tr><th>보고 일자</th><th>작성자 / 프로젝트</th><th>업무</th><th>저장 상태</th><th></th></tr></thead><tbody>'+recent.map(r=>reportRow(r,false)).join('')+'</tbody></table></div>':'<div class="empty"><div class="empty-ill">'+icon('file',31)+'</div><h3>첫 번째 업무보고를 기다리고 있어요</h3><p>아직 저장된 보고서가 없습니다.<br>오늘의 업무를 기록하며 나만의 업무 기록을 시작해 보세요.</p>'+button('new','첫 보고서 작성하기','plus','')+'<button class="link-button" style="margin-top:17px" data-action="demo">먼저 샘플 체험하기 '+icon('arrow',13)+'</button></div>')+'</section><aside class="dashboard-aside"><section class="card"><div class="card-body"><h2 class="small-title">하루를 정리하는 3가지 단계</h2><div class="workflow"><span class="step">01</span><div><strong>오늘의 업무 기록</strong><p>수행 내용과 결과를 정리하고<br>진행률과 투입 시간을 남겨요.</p></div></div><div class="workflow"><span class="step">02</span><div><strong>내일의 계획 확인</strong><p>다음 업무와 이슈를 미리 점검해요.</p></div></div><div class="workflow" style="margin-bottom:0"><span class="step">03</span><div><strong>저장하고 이어가기</strong><p>기기에 저장하고 필요할 때<br>인쇄하거나 백업해 두세요.</p></div></div></div></section><div class="note-card"><h3>'+icon('shield',15)+' 내 기록은 이 브라우저에</h3><p>보고서는 현재 브라우저에만 저장됩니다.<br>회사에 제출되거나 공유되지 않아요.<br>중요한 기록은 정기적으로 백업해 주세요.</p><button class="link-button" style="margin-top:12px;color:#668696" data-nav="help">저장 및 백업 안내 '+icon('arrow',12)+'</button></div></aside></div>';
}
function metric(label,val,unit,i,foot){return '<div class="metric"><div class="metric-top">'+label+'<span class="metric-icon">'+icon(i,16)+'</span></div><div class="metric-value">'+num(val)+'<small>'+unit+'</small></div><div class="metric-foot">'+foot+'</div></div>'}
function inputField(key,label,type='text',placeholder='',extra=''){return '<div class="field '+(key==='project'?'span-2':'')+'"><label for="f-'+key+'">'+label+'</label><input id="f-'+key+'" name="'+key+'" data-field="'+key+'" type="'+type+'" value="'+esc(current[key])+'" placeholder="'+esc(placeholder)+'" '+extra+'></div>'}
function editor(){const existing=reports.some(r=>r.id===current.id);
 return head('DAILY REPORT',existing?'업무보고 수정':'일일 업무보고 작성','오늘의 성과와 내일의 계획을 한 장의 기록으로 남겨보세요.','<span class="pill">'+(current.isDemo?'샘플 체험 · 실제 보고 아님':'개인 로컬 기록')+'</span>')+
 '<div class="success-note">'+icon('shield',15)+'<span>이 보고서는 브라우저에만 저장됩니다. <strong>저장은 회사 제출 또는 결재가 아닙니다.</strong> 입력 내용은 자동으로 임시저장됩니다.</span></div><div id="formErrors" class="error-box" role="alert" tabindex="-1"></div>'+
 '<div class="editor-grid"><form id="reportForm" novalidate><section class="card editor-section"><div class="card-head"><div class="section-title"><span class="section-num">01</span><h2>기본 정보</h2></div><span class="muted" style="font-size:10px">* 필수 입력</span></div><div class="fields">'+inputField('date','보고 일자<span class="required">*</span>','date','','required min="1900-01-01" max="2199-12-31"')+inputField('author','작성자<span class="required">*</span>','text','이름 입력','required maxlength="100" autocomplete="name"')+inputField('department','소속 부서<span class="required">*</span>','text','부서 입력 또는 선택','required maxlength="100" list="departments"')+inputField('role','직위 / 직책','text','예: 대리 / 담당','maxlength="100"')+inputField('project','프로젝트 / 현장','text','프로젝트명 또는 현장명 입력','maxlength="200"')+inputField('reviewer','검토자<span class="optional">선택</span>','text','기록용, 실제 결재 요청 아님','maxlength="100"')+'</div><datalist id="departments"><option value="설계팀"><option value="현장관리팀"><option value="품질관리팀"><option value="안전관리팀"><option value="경영지원팀"></datalist></section>'+
 '<section class="card editor-section"><div class="card-head"><div class="section-title"><span class="section-num">02</span><h2>오늘의 업무</h2></div><span class="muted" style="font-size:10px">업무명 1개 이상 필수</span></div><div class="task-list">'+current.tasks.map(taskEditor).join('')+'<button type="button" class="btn add-task" data-action="add-task" '+(current.tasks.length>=100?'disabled':'')+'>'+icon('plus',15)+' 업무 항목 추가</button></div></section>'+
 '<section class="card editor-section"><div class="card-head"><div class="section-title"><span class="section-num">03</span><h2>계획 및 공유 사항</h2></div></div><div class="text-fields">'+textField('nextPlans','내일의 업무 계획','다음 업무일에 진행할 업무와 우선순위를 적어주세요.')+textField('issues','이슈 / 리스크','일정 지연, 안전·품질 이슈 및 대응 방안 등')+textField('requests','협조 / 요청 사항','필요한 지원, 확인 또는 협조 사항')+textField('notes','기타 메모','추가로 남기고 싶은 내용을 자유롭게 적어주세요.')+'</div></section><div class="bottom-actions"><button type="button" class="btn ghost" data-action="new">새 보고서로 시작</button><div class="actions"><span class="keyboard">Ctrl / ⌘ + S</span><button class="btn primary" type="submit">'+icon('check',16)+(existing?'수정 내용 저장':'보고서 저장')+'</button></div></div></form><aside class="summary"><section class="card"><div class="card-head"><h2>작성 현황</h2><span class="badge neutral">로컬</span></div><div class="card-body"><div><div class="summary-title">REPORT SUMMARY</div><div id="summaryDate" class="summary-date"></div><div id="summaryPerson" class="summary-person"></div><div class="summary-stat"><span>업무 항목</span><b id="summaryTasks"></b></div><div class="summary-stat"><span>투입 시간</span><b id="summaryHours"></b></div><div class="summary-stat"><span>평균 진행률</span><b id="summaryProgress"></b></div><div class="progress-track" role="progressbar" aria-label="작성 중 업무 평균 진행률" aria-valuemin="0" aria-valuemax="100" id="summaryBar"><div class="progress-fill" id="progressFill"></div></div></div><div class="summary-status" id="summaryStatuses"></div><button class="btn primary full" data-action="save">'+icon('check',16)+' 보고서 저장</button><button class="btn full" data-action="preview-current">'+icon('print',16)+' 미리보기 / 인쇄</button><button class="btn full" data-action="copy">'+icon('copy',15)+' 텍스트 복사</button><div id="autosave" class="autosave" aria-live="polite"></div></div></section><p class="summary-disclaimer">업무명이 있는 항목으로 통계를 계산합니다.<br>진행률은 업무별 단순 평균입니다.<br>시간은 항목별 0~24시간을 입력하세요.</p></aside></div>';
}
function textField(key,label,ph){return '<div class="field"><label for="f-'+key+'">'+label+'</label><textarea id="f-'+key+'" name="'+key+'" data-field="'+key+'" maxlength="10000" placeholder="'+ph+'">'+esc(current[key])+'</textarea></div>'}
function taskEditor(t,i){const opts=(vals,currentVal)=>vals.map(v=>'<option value="'+v+'" '+(v===currentVal?'selected':'')+'>'+v+'</option>').join('');return '<div class="task"><div class="task-top"><span class="task-heading">'+icon('file',14)+' 업무 '+String(i+1).padStart(2,'0')+'</span><button type="button" class="icon-button" data-action="remove-task" data-index="'+i+'" aria-label="업무 '+(i+1)+' 삭제" '+(current.tasks.length===1?'disabled':'')+'>'+icon('trash',15)+'</button></div><div class="task-fields"><div class="field category"><label for="t-'+i+'-category">업무 분류</label><select id="t-'+i+'-category" data-task="'+i+'" data-key="category">'+opts(CATEGORIES,t.category)+'</select></div><div class="field task-title"><label for="t-'+i+'-task">업무명 / 수행 내용<span class="required">*</span></label><input id="t-'+i+'-task" data-task="'+i+'" data-key="task" maxlength="1000" value="'+esc(t.task)+'" placeholder="진행한 업무를 입력하세요"></div><div class="field result"><label for="t-'+i+'-result">수행 결과 / 산출물</label><textarea id="t-'+i+'-result" data-task="'+i+'" data-key="result" maxlength="5000" style="min-height:68px" placeholder="주요 성과, 산출물, 확인 내용을 적어주세요">'+esc(t.result)+'</textarea></div><div class="field"><label for="t-'+i+'-status">업무 상태</label><select id="t-'+i+'-status" data-task="'+i+'" data-key="status">'+opts(STATUSES,t.status)+'</select></div><div class="field"><label for="t-'+i+'-progress">진행률 (%)</label><input id="t-'+i+'-progress" data-task="'+i+'" data-key="progress" type="number" min="0" max="100" step="1" value="'+esc(t.progress)+'"></div><div class="field"><label for="t-'+i+'-hours">투입 시간 (h)</label><input id="t-'+i+'-hours" data-task="'+i+'" data-key="hours" type="number" min="0" max="24" step="0.25" value="'+esc(t.hours)+'"></div></div></div>'}
function updateSummary(){if(view!=='write')return;const s=stats([current]);$('#summaryDate').textContent=dateText(current.date);$('#summaryPerson').textContent=(current.author.trim()||'작성자 미입력')+' · '+(current.department.trim()||'부서 미입력');$('#summaryTasks').textContent=s.tasks+'개';$('#summaryHours').textContent=num(s.hours)+' h';$('#summaryProgress').textContent=s.progress+'%';$('#progressFill').style.width=s.progress+'%';$('#summaryBar').setAttribute('aria-valuenow',s.progress);$('#summaryStatuses').innerHTML=STATUSES.map(st=>'<div class="status-row"><span>'+st+'</span><span>'+activeTasks(current).filter(t=>t.status===st).length+'건</span></div>').join('')}
function errors(r){const list=[];if(!validDate(r.date))list.push('올바른 보고 일자를 입력하세요. (1900~2199년)');if(!r.author.trim())list.push('작성자 이름을 입력하세요.');if(!r.department.trim())list.push('소속 부서를 입력하세요.');if(!r.tasks.some(t=>t.task.trim()))list.push('업무명을 최소 1개 입력하세요.');r.tasks.forEach((t,i)=>{if(!Number.isFinite(t.progress)||t.progress<0||t.progress>100)list.push('업무 '+(i+1)+': 진행률은 0~100 사이여야 합니다.');if(!Number.isFinite(t.hours)||t.hours<0||t.hours>24)list.push('업무 '+(i+1)+': 시간은 0~24 사이여야 합니다.');if(!t.task.trim()&&(t.result.trim()||t.hours>0||t.progress>0||t.status!=='예정'))list.push('업무 '+(i+1)+': 입력된 내용에 해당하는 업무명을 적어주세요.');});return list}
function validateCurrent(){const list=errors(current);if(list.length){if(view==='write'){const el=$('#formErrors');el.innerHTML='<strong>다음 항목을 확인해 주세요.</strong><ul>'+list.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';el.focus();el.scrollIntoView({block:'center',behavior:'smooth'})}else toast(list[0],true);return false}if($('#formErrors'))$('#formErrors').innerHTML='';return true}
function saveReport(){if(!validateCurrent())return;clearTimeout(saveTimer);saveTimer=null;let data;try{data=normalizeReport({...current,updatedAt:now()});data.tasks=data.tasks.filter(t=>t.task.trim());}catch(e){toast(e.message,true);return}const idx=reports.findIndex(r=>r.id===data.id);if(idx<0&&reports.length>=MAX_REPORTS){toast('최대 2,000건입니다. 먼저 백업하고 오래된 보고서를 정리하세요.',true);return}const next=reports.slice();if(idx>=0)next[idx]=data;else next.push(data);if(persistReports(next)){current=JSON.parse(JSON.stringify(data));autosave();render();toast('작성완료 · 이 브라우저에 저장했습니다. 회사에 제출되지 않았습니다.')}}
function hasContent(){return !!(current.author.trim()||current.department.trim()||current.project.trim()||current.role.trim()||current.reviewer.trim()||current.tasks.some(t=>t.task.trim()||t.result.trim()||t.hours||t.progress||t.status!=='예정')||current.nextPlans.trim()||current.issues.trim()||current.requests.trim()||current.notes.trim())}
function newReport(){if(hasContent()&&!confirm('현재 작성 중인 내용은 새 임시보고서로 바뀝니다. 저장되지 않은 수정 내용은 사라집니다. 새로 시작할까요?'))return;clearTimeout(saveTimer);current=blank();lastAutosave='';autosave();changeView('write')}
function editReport(id){const r=reports.find(r=>r.id===id);if(!r)return;if(r.id!==current.id&&hasContent()&&!confirm('현재 임시보고서를 선택한 보고서로 바꿀까요? 저장되지 않은 수정 내용은 사라집니다.'))return;clearTimeout(saveTimer);current=JSON.parse(JSON.stringify(r));autosave();changeView('write')}
function deleteReport(id){const r=reports.find(r=>r.id===id);if(!r||!confirm(dateText(r.date)+' · '+r.author+' 보고서를 삭제할까요? 저장된 보고서는 복구할 수 없습니다.'))return;if(persistReports(reports.filter(x=>x.id!==id))){if(current.id===id){current=blank();autosave()}render();toast('저장된 보고서를 삭제했습니다.')}}
function reportRow(r,full){const s=stats([r]);return '<tr><td>'+esc(dateText(r.date))+'</td><td><button class="report-link" data-action="edit-report" data-id="'+esc(r.id)+'" title="'+esc(r.author+' / '+(r.project||'프로젝트 미지정'))+'">'+esc(r.author)+' <span style="font-weight:400;color:#a0adb5">/ '+esc(r.project||r.department)+'</span></button>'+(r.isDemo?' <span class="badge demo">샘플</span>':'')+'</td><td>'+s.tasks+'건'+(full?' · '+num(s.hours)+'h':'')+'</td><td><span class="badge">작성완료 · 로컬</span></td><td><div class="actions">'+(full?'<button class="icon-button" data-action="preview-saved" data-id="'+esc(r.id)+'" aria-label="'+esc(r.author)+' 보고서 인쇄">'+icon('print',16)+'</button><button class="icon-button" data-action="edit-report" data-id="'+esc(r.id)+'" aria-label="'+esc(r.author)+' 보고서 수정">'+icon('edit',16)+'</button><button class="icon-button" data-action="delete" data-id="'+esc(r.id)+'" aria-label="'+esc(r.author)+' 보고서 삭제">'+icon('trash',16)+'</button>':'<button class="icon-button" data-action="edit-report" data-id="'+esc(r.id)+'" aria-label="보고서 열기">'+icon('arrow',15)+'</button>')+'</div></td></tr>'}
function filtered(){return reports.filter(r=>(!filters.q||[r.author,r.department,r.role,r.project,r.reviewer,...r.tasks.map(t=>t.task+' '+t.result),r.nextPlans,r.issues,r.requests,r.notes].join(' ').toLowerCase().includes(filters.q.toLowerCase()))&&(!filters.from||r.date>=filters.from)&&(!filters.to||r.date<=filters.to)&&(filters.kind==='all'||(filters.kind==='demo'?r.isDemo:!r.isDemo))).sort((a,b)=>b.date.localeCompare(a.date)||b.updatedAt.localeCompare(a.updatedAt))}
function archive(){return head('REPORT ARCHIVE','보고서 보관함','기록한 하루를 찾아보고, 필요한 내용을 다시 확인하세요.',button('csv','CSV 내보내기','download','')+button('new','새 보고서 작성'))+'<section class="card"><div class="filters"><div class="field search"><label for="filter-q">통합 검색</label><input id="filter-q" data-filter="q" type="search" value="'+esc(filters.q)+'" placeholder="작성자, 부서, 프로젝트, 업무 내용 검색"></div><div class="field"><label for="filter-from">시작 일자</label><input id="filter-from" data-filter="from" type="date" value="'+esc(filters.from)+'"></div><div class="field"><label for="filter-to">종료 일자</label><input id="filter-to" data-filter="to" type="date" value="'+esc(filters.to)+'"></div><div class="field"><label for="filter-kind">기록 구분</label><select id="filter-kind" data-filter="kind"><option value="all" '+(filters.kind==='all'?'selected':'')+'>전체</option><option value="real" '+(filters.kind==='real'?'selected':'')+'>일반 보고서</option><option value="demo" '+(filters.kind==='demo'?'selected':'')+'>샘플 보고서</option></select></div><button class="btn" data-action="reset-filters">초기화</button></div><div class="archive-count" id="archiveCount"></div><div id="archiveRows"></div></section><div class="note-card" style="margin-top:19px"><p>모든 보고서는 <strong>개인 기기의 작성완료 기록</strong>입니다. 실제 제출·승인 여부를 나타내지 않습니다. CSV에는 현재 검색 및 날짜 조건에 맞는 보고서만 포함됩니다. 전체 복원용 백업은 이용 안내에서 JSON으로 내보내세요.</p></div>'}
function renderArchiveRows(){const list=filtered();$('#archiveCount').textContent=(filters.from&&filters.to&&filters.from>filters.to?'시작 일자가 종료 일자보다 늦습니다. ':'')+'총 '+reports.length+'건 중 '+list.length+'건 · 업무명 기준 검색 포함';$('#archiveRows').innerHTML=list.length?'<div class="table-wrap"><table><thead><tr><th>보고 일자</th><th>작성자 / 프로젝트</th><th>업무 / 시간</th><th>저장 상태</th><th>관리</th></tr></thead><tbody>'+list.map(r=>reportRow(r,true)).join('')+'</tbody></table></div>':'<div class="empty"><div class="empty-ill">'+icon('search',30)+'</div><h3>'+(reports.length?'조건에 맞는 기록이 없어요':'저장된 보고서가 없어요')+'</h3><p>'+(reports.length?'검색어나 날짜 조건을 변경해 보세요.':'새 보고서를 작성하고 저장하면 이곳에서 확인할 수 있습니다.')+'</p>'+button(reports.length?'reset-filters':'new',reports.length?'검색 조건 초기화':'새 보고서 작성','plus','')+'</div>'}
function help(){return head('WORKSPACE GUIDE','이용 안내','기록을 안전하게 관리하기 위한 사용 방법을 확인하세요.')+'<div class="warning"><strong>일반 일일보고 양식 · 사내 공식 양식 확인 전</strong><p>이 사이트는 개인용 기록 도구이며 회사의 공식 서비스, 공식 로고 또는 공식 결재 시스템이 아닙니다. ACE ENGINEERING은 텍스트 식별 표기로만 사용합니다. 사내 양식·보안·보고 절차를 우선 확인해 주세요.</p></div><div class="help-grid"><section class="card help-card"><h2>'+icon('edit',19)+' 작성과 저장</h2><ol><li>보고 일자, 작성자, 소속 부서와 업무명을 입력합니다.</li><li>업무 분류·결과·상태·진행률과 시간을 기록합니다. 시간은 업무별 0~24시간, 진행률은 0~100%입니다.</li><li>입력 내용은 약 0.6초 후 임시저장되며 새로고침 후 복구됩니다. 임시보고서는 한 개만 유지됩니다.</li><li><strong>보고서 저장</strong>으로 작성완료 기록을 만듭니다. 저장은 실제 회사 제출이나 승인이 아닙니다.</li><li>보관함에서 수정·삭제·검색·인쇄할 수 있습니다. 수정 시 기존 ID와 생성일을 유지합니다.</li></ol></section><section class="card help-card"><h2>'+icon('shield',19)+' 저장 위치와 개인정보</h2><p>모든 기록은 현재 브라우저의 <code>localStorage</code>에 저장됩니다. 서버 전송, GitHub 로그인 연동, 실제 결재, 팀 공유 및 다중 기기 동기화는 없습니다.</p><ul><li>같은 사이트 주소·같은 브라우저에서만 기록을 볼 수 있습니다.</li><li>브라우저 데이터 삭제, 시크릿 모드 종료, 저장 용량 초과 또는 기기 변경으로 데이터가 사라질 수 있습니다.</li><li>공용 기기에서는 개인정보·기밀 정보를 입력하지 마세요. 이 저장소는 별도로 암호화되지 않습니다.</li><li>저장소 오류가 감지되면 원본을 자동 삭제하거나 덮어쓰지 않습니다. 상단의 원본 내보내기를 이용하세요.</li></ul></section><section class="card help-card"><h2>'+icon('download',19)+' 백업과 가져오기</h2><p>JSON은 <strong>저장된 전체 보고서와 현재 임시보고서</strong>를 담는 복원용 백업입니다. 정기적으로 안전한 위치에 보관하세요. CSV는 보관함의 검색 결과를 업무별 한 행으로 내보냅니다.</p><p>가져오기는 이 도구의 버전 1 JSON만 지원합니다. 최대 5MB, 보고서 2,000건, 보고서별 업무 100개입니다. 동일 ID의 보고서는 건너뛰며, 기존 기록을 덮어쓰지 않습니다. 백업의 임시보고서는 자동 교체하지 않습니다.</p><div class="actions">'+button('backup','JSON 백업','download','')+button('import','JSON 가져오기','upload','')+'</div><p>CSV의 수식으로 해석될 수 있는 값은 작은따옴표를 붙여 보호합니다. JSON 백업에는 원문이 유지됩니다.</p></section><section class="card help-card"><h2>'+icon('print',19)+' 인쇄와 텍스트 복사</h2><p>작성 중이거나 저장된 보고서를 미리보기로 확인한 후 A4로 인쇄할 수 있습니다. 필수 입력을 완료해야 빈 양식 대신 보고서가 출력됩니다. 인쇄 화면의 대상을 <strong>PDF로 저장</strong>으로 선택하면 파일을 만들 수 있습니다.</p><p>텍스트 복사는 현재 보고서 전체를 일반 텍스트로 복사합니다. 브라우저 클립보드 권한이 없으면 수동 선택·복사 창을 제공합니다. 실제 전달·제출은 회사가 지정한 절차로 별도 진행해 주세요.</p><div class="actions">'+button('demo','샘플 체험','file','')+'</div><p>샘플은 작성 화면에만 불러오며 자동 저장된 완료 보고서나 실제 제출로 처리되지 않습니다. 직접 저장하면 샘플로 구분됩니다.</p></section><section class="card help-card help-wide"><h2>'+icon('archive',19)+' GitHub Pages 정적 배포</h2><ol><li>개인정보가 없는 이 <code>index.html</code> 파일만 GitHub 저장소에 업로드합니다. 백업 JSON·CSV는 공개 저장소에 올리지 마세요.</li><li>저장소의 <strong>Settings → Pages → Build and deployment</strong>에서 <strong>Deploy from a branch</strong>를 선택합니다.</li><li>파일이 있는 브랜치와 폴더(예: <code>main / root</code>)를 선택하고 저장한 뒤 GitHub가 표시한 배포 주소로 접속합니다.</li><li>이 사이트는 정적 파일 한 개로 동작하며 OAuth·서버·데이터베이스 설정은 없습니다. HTTPS 환경에서 클립보드 기능이 더 안정적으로 동작합니다.</li></ol><p>로컬 파일 주소와 배포 주소는 저장소가 서로 다릅니다. 기기나 주소를 바꾸기 전 JSON을 백업하고 새 환경에서 가져오세요. GitHub Pages에 배포해도 보고서가 GitHub에 저장되거나 팀에 공유되지는 않습니다.</p></section></div>'}
function printable(r){const tasks=activeTasks(r),s=stats([r]);const meta=[['보고 일자',dateText(r.date)],['작성자',r.author],['소속 부서',r.department],['직위 / 직책',r.role||'미입력'],['프로젝트 / 현장',r.project||'미입력'],['검토자 (기록용)',r.reviewer||'미입력']];return '<article class="print-sheet"><div class="print-top"><div class="print-brand">ACE<small>ENGINEERING</small></div><div><h1>일일 업무보고</h1><p>'+(r.isDemo?'샘플 보고서 · 실제 보고 아님':'개인 로컬 기록 · 미제출')+'</p></div></div><div class="print-meta">'+meta.map(([l,v])=>'<div><label>'+l+'</label>'+esc(v)+'</div>').join('')+'</div><section class="print-section"><h2>01 오늘의 업무 <span style="float:right;font-size:10px;font-weight:400">'+s.tasks+'개 업무 · '+num(s.hours)+'h · 평균 '+s.progress+'%</span></h2><table><thead><tr><th>분류</th><th>업무 / 수행 내용</th><th>결과 / 산출물</th><th>상태</th><th>진행률</th><th>시간</th></tr></thead><tbody>'+tasks.map(t=>'<tr><td>'+esc(t.category)+'</td><td>'+esc(t.task)+'</td><td>'+esc(t.result||'−')+'</td><td>'+esc(t.status)+'</td><td>'+num(t.progress)+'%</td><td>'+num(t.hours)+'h</td></tr>').join('')+'</tbody></table></section>'+[['02 내일의 업무 계획','nextPlans'],['03 이슈 / 리스크','issues'],['04 협조 / 요청 사항','requests'],['05 기타 메모','notes']].map(([l,k])=>'<section class="print-section"><h2>'+l+'</h2><div class="print-text">'+esc(r[k].trim()||'기재 사항 없음')+'</div></section>').join('')+'<footer class="print-foot">일반 일일보고 양식 · 사내 공식 양식 확인 전<br>브라우저 로컬 기록입니다. 회사 제출·검토·결재를 의미하지 않습니다.<br>보고서 ID: '+esc(r.id)+'</footer></article>'}
function openPreview(r){if(errors(r).length){toast('인쇄 전 필수 항목과 업무 입력 범위를 확인하세요.',true);return}previewReport=JSON.parse(JSON.stringify(r));const html=printable(previewReport);$('#previewContent').innerHTML=html;$('#printRoot').innerHTML=html;$('#preview').showModal()}
function textReport(r){return [(r.isDemo?'[샘플 보고서]\n':'')+'ACE ENGINEERING | 일일 업무보고','보고 일자: '+r.date,'작성자: '+r.author+' / '+r.department,'직위·직책: '+(r.role||'미입력'),'프로젝트·현장: '+(r.project||'미입력'),'검토자(기록용): '+(r.reviewer||'미입력'),'','[오늘의 업무]',...activeTasks(r).map((t,i)=>(i+1)+'. ['+t.category+'] '+t.task+'\n   결과: '+(t.result||'미입력')+'\n   상태: '+t.status+' | 진행률: '+t.progress+'% | 시간: '+t.hours+'h'),...['nextPlans','issues','requests','notes'].map((k,i)=>'\n['+['내일의 업무 계획','이슈 / 리스크','협조 / 요청 사항','기타 메모'][i]+']\n'+(r[k]||'기재 사항 없음')),'','일반 일일보고 양식 · 사내 공식 양식 확인 전','개인 로컬 기록입니다. 실제 회사 제출·승인 내역이 아닙니다.'].join('\n')}
async function copyReport(){if(!validateCurrent())return;const txt=textReport(current);try{if(!navigator.clipboard?.writeText)throw Error('unavailable');await navigator.clipboard.writeText(txt);toast('보고서 텍스트를 복사했습니다.')}catch(e){const dlg=document.createElement('dialog');dlg.setAttribute('aria-label','보고서 텍스트 수동 복사');dlg.innerHTML='<div class="preview-toolbar"><strong>텍스트 복사</strong><button class="btn small" type="button">닫기</button></div><div style="padding:22px"><p style="font-size:12px">클립보드를 사용할 수 없습니다. 아래 내용을 선택해 Ctrl / ⌘ + C로 복사하세요.</p><textarea aria-label="복사할 보고서 내용" readonly style="height:55vh"></textarea></div>';document.body.append(dlg);dlg.querySelector('textarea').value=txt;dlg.querySelector('button').onclick=()=>dlg.close();dlg.addEventListener('close',()=>dlg.remove());dlg.showModal();dlg.querySelector('textarea').focus();dlg.querySelector('textarea').select()}}
function download(text,name,type){try{const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('파일 다운로드를 시작했습니다.')}catch(e){toast('파일을 내보내지 못했습니다.',true)}}
function backup(){if(saveTimer)autosave();let draft=null;try{draft=normalizeReport(current,false)}catch(e){toast('입력값이 올바르지 않아 임시보고서는 백업에서 제외합니다.',true)}download(JSON.stringify({version:1,exportedAt:now(),reports,draft},null,2),'ace-daily-backup-'+today()+'.json','application/json;charset=utf-8')}
function csv(){const list=view==='archive'?filtered():reports;if(!list.length){toast('내보낼 보고서가 없습니다.',true);return}const rows=[['보고서 ID','구분','보고 일자','작성자','부서','직위/직책','프로젝트/현장','검토자(기록용)','업무 분류','업무 내용','수행 결과','상태','진행률(%)','시간(h)','내일 계획','이슈/리스크','협조/요청','메모','저장 상태']];list.forEach(r=>activeTasks(r).forEach(t=>rows.push([r.id,r.isDemo?'샘플':'일반',r.date,r.author,r.department,r.role,r.project,r.reviewer,t.category,t.task,t.result,t.status,t.progress,t.hours,r.nextPlans,r.issues,r.requests,r.notes,'작성완료 · 로컬 미제출'])));const cell=v=>{let x=String(v??'');if(/^[\s\u0000-\u001f]*[=+@-]/.test(x)||/^[\t\r\n]/.test(x))x="'"+x;return '"'+x.replace(/"/g,'""')+'"'};download('\uFEFF'+rows.map(row=>row.map(cell).join(',')).join('\r\n'),'ace-daily-reports-'+today()+'.csv','text/csv;charset=utf-8')}
async function importJSON(file){if(!file)return;if(reportsBlocked){toast('저장소 문제가 해결되기 전에는 가져올 수 없습니다.',true);return}if(file.size>MAX_FILE){toast('5MB 이하 JSON 파일만 가져올 수 있습니다.',true);return}try{const obj=JSON.parse(await file.text());if(!isObj(obj)||obj.version!==1||!Array.isArray(obj.reports)||obj.reports.length>MAX_REPORTS)throw Error('버전 1의 보고서 백업 JSON이 아닙니다.');if(obj.exportedAt!==undefined&&(typeof obj.exportedAt!=='string'||!Number.isFinite(Date.parse(obj.exportedAt))))throw Error('백업 생성일 형식이 올바르지 않습니다.');const imported=obj.reports.map(r=>normalizeReport(r));if(obj.draft!==undefined&&obj.draft!==null)normalizeReport(obj.draft,false);const seen=new Set(reports.map(r=>r.id)),added=[];let duplicate=0;for(const r of imported){if(seen.has(r.id)){duplicate++;continue}seen.add(r.id);added.push(r)}if(reports.length+added.length>MAX_REPORTS)throw Error('병합 후 보고서는 최대 2,000건 이하여야 합니다.');if(!added.length){toast('추가할 새 보고서가 없습니다. 동일 ID '+duplicate+'건은 유지했습니다. 백업 임시보고서는 자동으로 가져오지 않습니다.');return}if(!confirm('새 보고서 '+added.length+'건을 가져올까요?\n중복 ID '+duplicate+'건은 건너뛰며 기존 기록과 현재 임시보고서는 유지합니다.\n가져온 데이터는 이 브라우저에만 저장됩니다.'))return;if(persistReports([...reports,...added])){render();toast(added.length+'건을 가져왔습니다. 중복 '+duplicate+'건은 건너뛰었습니다.')}}catch(e){toast('가져오기 취소: '+(e instanceof SyntaxError?'손상되었거나 JSON이 아닌 파일입니다.':e.message),true)}finally{$('#importFile').value=''}}
function demo(){if(hasContent()&&!confirm('샘플을 불러오면 현재 임시보고서가 바뀝니다. 저장하지 않은 수정 내용은 사라집니다. 계속할까요?'))return;clearTimeout(saveTimer);current={...blank(),author:'샘플 사용자',department:'샘플 설계팀',role:'담당 (샘플)',project:'샘플 프로젝트 A',isDemo:true,tasks:[{category:'설계',task:'[샘플] 도면 검토 및 수정 사항 정리',result:'검토 의견 3건 정리, 수정 체크리스트 작성',status:'완료',progress:100,hours:3},{category:'품질',task:'[샘플] 자재 사양 확인',result:'제조사 자료 검토 중, 추가 자료 확인 필요',status:'진행',progress:50,hours:2}],nextPlans:'[샘플] 검토 의견 반영 후 수정 도면 확인\n자재 사양 관련 추가 자료 요청',issues:'[샘플] 자료 회신 지연 가능성 점검',requests:'[샘플] 관련 자료 확인 요청',notes:'이 보고서는 기능 체험용 예시입니다. 실제 업무 또는 회사 제출 기록이 아닙니다.'};autosave();changeView('write');toast('샘플을 작성 화면에 불러왔습니다. 완료 보고서로 저장하거나 제출하지 않았습니다.')}
document.addEventListener('input',e=>{const el=e.target;if(el.matches('[data-field]')){current[el.dataset.field]=el.value;updateSummary();scheduleSave()}else if(el.matches('[data-task][data-key]')){const key=el.dataset.key,t=current.tasks[Number(el.dataset.task)];if(!t)return;t[key]=['hours','progress'].includes(key)?(el.value===''?0:Number(el.value)):el.value;updateSummary();scheduleSave()}else if(el.matches('[data-filter]')){filters[el.dataset.filter]=el.value;renderArchiveRows()}});
document.addEventListener('change',e=>{if(e.target.id==='importFile')importJSON(e.target.files[0]);if(e.target.matches('select[data-task]')){const t=current.tasks[Number(e.target.dataset.task)];if(t){t[e.target.dataset.key]=e.target.value;updateSummary();scheduleSave()}}if(e.target.matches('select[data-filter]')){filters[e.target.dataset.filter]=e.target.value;renderArchiveRows()}});
document.addEventListener('submit',e=>{if(e.target.id==='reportForm'){e.preventDefault();saveReport()}});
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el||el.disabled)return;if(el.dataset.nav){changeView(el.dataset.nav);return}const action=el.dataset.action;if(!action)return;switch(action){case'new':newReport();break;case'save':saveReport();break;case'demo':demo();break;case'add-task':if(current.tasks.length<100){current.tasks.push(emptyTask());autosave();render();const id='#t-'+(current.tasks.length-1)+'-task';$(id)?.focus()}break;case'remove-task':if(current.tasks.length>1){const idx=Number(el.dataset.index),t=current.tasks[idx];if((t.task||t.result||t.hours||t.progress)&&!confirm('이 업무 항목을 삭제할까요?'))return;current.tasks.splice(idx,1);autosave();render()}break;case'edit-report':editReport(el.dataset.id);break;case'delete':deleteReport(el.dataset.id);break;case'preview-current':if(validateCurrent())openPreview(current);break;case'preview-saved':{const r=reports.find(x=>x.id===el.dataset.id);if(r)openPreview(r);break}case'close-preview':$('#preview').close();break;case'print-confirm':if(previewReport){$('#printRoot').innerHTML=printable(previewReport);window.print()}break;case'copy':copyReport();break;case'csv':csv();break;case'backup':backup();break;case'import':$('#importFile').value='';$('#importFile').click();break;case'reset-filters':filters={q:'',from:'',to:'',kind:'all'};render();break;case'recovery':download(JSON.stringify({recoveredAt:now(),note:'원본 저장소 데이터. 자동 가져오기 형식이 아닙니다. 원본을 안전하게 보관하세요.',items:broken},null,2),'ace-storage-recovery-'+today()+'.json','application/json;charset=utf-8');break}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'&&view==='write'&&!document.querySelector('dialog[open]')){e.preventDefault();saveReport()}});
window.addEventListener('beforeunload',()=>{if(saveTimer)autosave()});
window.addEventListener('storage',e=>{if(e.key===KEY||e.key===null){reportsBlocked=true;broken.push({key:KEY,raw:e.newValue});warning();toast('다른 탭에서 저장소가 바뀌었습니다. 충돌을 막기 위해 저장을 중지합니다. 현재 내용을 복사한 후 새로고침하세요.',true)}if(e.key===DRAFT||e.key===null){draftBlocked=true;broken.push({key:DRAFT,raw:e.newValue});warning();lastAutosave='다른 탭 변경 감지 · 임시저장 중지';updateAutosave()}});
$('#today').textContent=new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
load();render();if(draftPresent)setTimeout(()=>toast('이전 임시보고서를 복구했습니다. 보고서 작성에서 이어 쓸 수 있습니다.'),500);
})();
</script>
</body>
</html>
